<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redirecionando para a RTG</title>
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://www.rtgengenharia.com/">
  <meta http-equiv="refresh" content="0;url=https://www.rtgengenharia.com/">
  <script>
    (function () {
      var target = 'https://www.rtgengenharia.com' + location.pathname + location.search + location.hash;
      location.replace(target);
    }());
  </script>
</head>
<body>
  <p>Redirecionando para <a href="https://www.rtgengenharia.com/">www.rtgengenharia.com</a>.</p>
</body>
</html>
